name: FreeNet Router CI

on:
  pull_request:
    paths:
      - 'README.md'
      - 'VERSION'
      - 'bootstrap.sh'
      - 'install.sh'
      - 'doctor.sh'
      - 'docs/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'freenet-ui/**'
      - 'deploy/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: freenet-ui/go.mod

      - name: Stamp UI version from VERSION
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid VERSION: $VERSION" >&2; exit 1 ;;
          esac
          UI_VERSION="${VERSION#v}"
          sed -i "s/^const version = \".*\"$/const version = \"$UI_VERSION\"/" freenet-ui/main.go
          grep -Fq "const version = \"$UI_VERSION\"" freenet-ui/main.go
          echo "FreeNet UI version: $UI_VERSION"

      - name: Go tests
        working-directory: freenet-ui
        run: |
          go test ./...
          go vet ./...

      - name: Shell syntax
        run: |
          sh -n bootstrap.sh
          sh -n install.sh
          sh -n doctor.sh
          sh -n scripts/vpn
          sh -n scripts/blanc_xkeen_update_outbounds.sh
          sh -n scripts/migrate_split_dns.sh
          sh -n scripts/bootstrap_entware.sh
          sh -n scripts/apply_network_profile.sh
          sh -n scripts/apply_provider_profile.sh
          sh -n scripts/finalize_setup.sh
          sh -n tests/test_vpn_contract.sh
          sh -n tests/test_split_dns_migration.sh
          sh -n tests/test_bootstrap_contract.sh
          sh -n tests/test_product_bootstrap_contract.sh
          sh -n tests/test_network_profile_contract.sh
          sh -n tests/test_provider_profile_apply.sh
          sh -n tests/test_finalize_setup.sh
          sh -n deploy/S99freenet-ui

      - name: VPN transactional switch test
        run: sh tests/test_vpn_contract.sh

      - name: Split DNS migration candidate test
        run: sh tests/test_split_dns_migration.sh

      - name: Entware bootstrap contract test
        run: sh tests/test_bootstrap_contract.sh

      - name: Product bootstrap contract test
        run: sh tests/test_product_bootstrap_contract.sh

      - name: ISP network profile contract test
        run: sh tests/test_network_profile_contract.sh

      - name: Provider profile transactional test
        run: sh tests/test_provider_profile_apply.sh

      - name: Browser setup completion contract test
        run: sh tests/test_finalize_setup.sh

      - name: VPN updater contract
        run: |
          grep -q 'FREENET_FILTER_OVERRIDE' scripts/vpn
          grep -q 'FREENET_FILTER_OVERRIDE' scripts/blanc_xkeen_update_outbounds.sh
          grep -q 'profile filter committed after successful' scripts/blanc_xkeen_update_outbounds.sh
          grep -q 'matching Extra candidates' scripts/blanc_xkeen_update_outbounds.sh
          grep -q 'candidate fingerprint' scripts/blanc_xkeen_update_outbounds.sh
          grep -q 'ROLLBACK: restoring previous 04_outbounds.json and profile filter' scripts/blanc_xkeen_update_outbounds.sh
          grep -q "Cache-Control: no-cache" scripts/blanc_xkeen_update_outbounds.sh
          ! grep -Fq 'echo "$FILTER" > "$FILTER_FILE"' scripts/vpn

      - name: Split DNS migration contract
        run: |
          grep -q -- '--build-only' scripts/migrate_split_dns.sh
          grep -q 'proxy_dns' scripts/migrate_split_dns.sh
          grep -q 'ndnproxy' scripts/migrate_split_dns.sh
          grep -q 'dns-vless' scripts/migrate_split_dns.sh
          grep -q 'dns-direct' scripts/migrate_split_dns.sh
          grep -q 'dns-out' scripts/migrate_split_dns.sh
          grep -q 'candidate Xray config' scripts/migrate_split_dns.sh
          grep -q 'ROLLBACK ERROR: FAILED/UNKNOWN' scripts/migrate_split_dns.sh
          ! grep -q '"listen"[[:space:]]*:[[:space:]]*"0\.0\.0\.0"' scripts/migrate_split_dns.sh

      - name: Installer contract
        run: |
          grep -q 'REPO="VoltickVL/FreeNet-Router"' install.sh
          grep -q 'releases/latest/download' install.sh
          grep -q 'SHA256SUMS' install.sh
          grep -q 'bootstrap_ip' install.sh
          grep -q '77.88.8.8 8.8.8.8' install.sh
          grep -q 'normalize_legacy_cron' install.sh
          grep -q '# BEGIN FREENET' install.sh
          grep -q 'abort_signal' install.sh
          grep -q 'ROLLBACK:' install.sh
          grep -q 'CONFIG_DIR="/opt/etc/freenet"' install.sh
          grep -q '/opt/etc/xray/blanc_subscription.url' install.sh
          grep -q 'snapshot_xray' install.sh
          grep -q 'migrate_split_dns.sh' install.sh
          grep -q 'LAN-only listener' install.sh
          ! grep -q 'setup.sh' install.sh
          grep -q 'REPO="VoltickVL/FreeNet-Router"' bootstrap.sh
          grep -q 'bootstrap_entware.sh" plan' bootstrap.sh
          grep -q 'bootstrap_entware.sh" apply' bootstrap.sh
          grep -q 'NEXT=Open the panel' bootstrap.sh
          grep -q 'cp bootstrap.sh dist/bootstrap.sh' .github/workflows/release.yml
          grep -q 'cp install.sh dist/freenet' .github/workflows/release.yml
          grep -q 'cp scripts/migrate_split_dns.sh dist/migrate_split_dns.sh' .github/workflows/release.yml
          grep -q 'cp scripts/bootstrap_entware.sh dist/bootstrap_entware.sh' .github/workflows/release.yml
          grep -q 'cp config/upstream-pins.env dist/upstream-pins.env' .github/workflows/release.yml
          grep -q '^v0\.' VERSION
          grep -q 'Stamp UI version from VERSION' .github/workflows/release.yml

      - name: Doctor contract
        run: |
          grep -q 'MUTATION=NONE' doctor.sh
          grep -q 'MODE=READY_EXISTING_STACK' doctor.sh
          grep -q 'MODE=ENTWARE_ONLY' doctor.sh
          grep -q 'xray run -test' doctor.sh
          ! grep -Eq '^[[:space:]]*(opkg[[:space:]]+(install|upgrade)|reboot([[:space:]]|$)|restart([[:space:]]|$)|killall([[:space:]]|$)|crontab[[:space:]]+[^-l])' doctor.sh

      - name: Upstream pin contract
        run: |
          set -eu
          . ./config/upstream-pins.env
          test "$PIN_POLICY_VERSION" = "2"
          test "$XKEEN_REPO" = "jameszeroX/XKeen"
          test "$XKEEN_VERSION" = "2.0"
          test "$XKEEN_ASSET" = "xkeen.tar.gz"
          test "$XRAY_REPO" = "XTLS/Xray-core"
          test "$XRAY_VERSION" = "v26.7.28"
          test "$XKEEN_UI_REPO" = "zxc-rv/XKeen-UI"
          test "$XKEEN_UI_VERSION" = "v1.1.3"
          for V in \
            XKEEN_SHA256 \
            XRAY_ARM64_SHA256 \
            XRAY_MIPS32LE_SHA256 \
            XRAY_MIPS32_SHA256 \
            XKEEN_UI_ARM64_SHA256 \
            XKEEN_UI_MIPS32LE_SHA256 \
            XKEEN_UI_MIPS32_SHA256
          do
            eval "VALUE=\${$V}"
            printf '%s' "$VALUE" | grep -Eq '^[0-9a-f]{64}$'
          done
          ! grep -Ei 'releases/(latest|download/latest)|/latest/download' config/upstream-pins.env docs/UPSTREAM-PINS-RU.md scripts/bootstrap_entware.sh

      - name: UI recovery contract
        run: |
          # A VPN restart may interrupt only the HTTP response. The UI must keep polling
          # factual status instead of declaring an error before postcondition acceptance.
          grep -q 'AbortController' freenet-ui/web/index.html
          grep -q 'actionFinishedByStatus' freenet-ui/web/index.html
          grep -q 'VPN перезапускается. Ответ на запрос ещё не получен' freenet-ui/web/index.html
          ! grep -q 'Соединение прервалось во время перезапуска VPN' freenet-ui/web/index.html
          grep -q 'setInterval(loadStatus,2000)' freenet-ui/web/index.html

      - name: Secret surface guard
        run: |
          ! grep -Rni --exclude='*_test.go' -E \
            'vless://[0-9A-Fa-f-]{36}@|withblancvpn\.online|87\.86\.183\.|46\.37\.141\.4|blanc_subscription\.url.*https?://|"publicKey"[[:space:]]*:[[:space:]]*"[^$]' \
            bootstrap.sh install.sh doctor.sh scripts tests config freenet-ui deploy README.md docs

      - name: Cross-build direct router binaries
        run: |
          mkdir -p dist
          (
            cd freenet-ui
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
              go build -trimpath -ldflags='-s -w' -o ../dist/freenet-ui-arm64-v8a .
          )
          (
            cd freenet-ui
            CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat \
              go build -trimpath -ldflags='-s -w' -o ../dist/freenet-ui-mips32le .
          )
          (
            cd freenet-ui
            CGO_ENABLED=0 GOOS=linux GOARCH=mips GOMIPS=softfloat \
              go build -trimpath -ldflags='-s -w' -o ../dist/freenet-ui-mips32 .
          )
          file dist/freenet-ui-*
          sha256sum dist/freenet-ui-*