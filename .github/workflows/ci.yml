name: FreeNet Router CI

on:
  pull_request:
    paths:
      - 'README.md'
      - 'VERSION'
      - 'install.sh'
      - 'setup.sh'
      - 'config/**'
      - 'scripts/**'
      - 'freenet-ui/**'
      - 'deploy/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: freenet-ui/go.mod

      - name: Go tests
        working-directory: freenet-ui
        run: |
          go test ./...
          go vet ./...

      - name: Shell syntax
        run: |
          sh -n install.sh
          sh -n setup.sh
          sh -n scripts/vpn
          sh -n scripts/blanc_xkeen_update_outbounds.sh
          sh -n deploy/S99freenet-ui

      - name: Installer contract
        run: |
          grep -q 'raw.githubusercontent.com/VoltickVL/FreeNet-Router/main/setup.sh' install.sh
          grep -q 'CRON_TOUCHED' install.sh
          grep -q 'xkeen.*-ug' install.sh
          grep -q 'blanc_xkeen_update_outbounds' install.sh
          grep -q 'crontab "$CRON_BEFORE"' install.sh
          grep -q 'REPO="VoltickVL/FreeNet-Router"' setup.sh
          grep -q 'releases/latest/download' setup.sh
          grep -q 'SHA256SUMS' setup.sh
          grep -q '# BEGIN FREENET' setup.sh
          grep -q 'CONFIG_DIR="/opt/etc/freenet"' setup.sh
          grep -q 'CONFIG_FILE="$CONFIG_DIR/freenet.conf"' setup.sh
          grep -q '/opt/etc/xray/blanc_subscription.url' setup.sh
          grep -q 'ROLLBACK:' setup.sh
          grep -q 'nslookup' setup.sh
          grep -q '^v0\.' VERSION

      - name: Secret surface guard
        run: |
          ! grep -Rni --exclude='*_test.go' -E \
            'vless://[0-9A-Fa-f-]{36}@|withblancvpn\.online|87\.86\.183\.|46\.37\.141\.4|blanc_subscription\.url.*https?://|"publicKey"[[:space:]]*:[[:space:]]*"[^$]' \
            install.sh setup.sh scripts config freenet-ui deploy README.md

      - name: Cross-build direct router binaries
        run: |
          mkdir -p dist
          (
            cd freenet-ui
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
              go build -trimpath -ldflags='-s -w' -o ../dist/freenet-ui-arm64-v8a .
          )
          (
            cd freenet-ui
            CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat \
              go build -trimpath -ldflags='-s -w' -o ../dist/freenet-ui-mips32le .
          )
          (
            cd freenet-ui
            CGO_ENABLED=0 GOOS=linux GOARCH=mips GOMIPS=softfloat \
              go build -trimpath -ldflags='-s -w' -o ../dist/freenet-ui-mips32 .
          )
          file dist/freenet-ui-*
          sha256sum dist/freenet-ui-*
