name: FreeNet Router CI

on:
  pull_request:
    paths:
      - 'README.md'
      - 'VERSION'
      - 'install.sh'
      - 'doctor.sh'
      - 'docs/**'
      - 'config/**'
      - 'scripts/**'
      - 'freenet-ui/**'
      - 'deploy/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: freenet-ui/go.mod

      - name: Stamp UI version from VERSION
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid VERSION: $VERSION" >&2; exit 1 ;;
          esac
          UI_VERSION="${VERSION#v}"
          sed -i "s/^const version = \".*\"$/const version = \"$UI_VERSION\"/" freenet-ui/main.go
          grep -Fq "const version = \"$UI_VERSION\"" freenet-ui/main.go
          echo "FreeNet UI version: $UI_VERSION"

      - name: Go tests
        working-directory: freenet-ui
        run: |
          go test ./...
          go vet ./...

      - name: Shell syntax
        run: |
          sh -n install.sh
          sh -n doctor.sh
          sh -n scripts/vpn
          sh -n scripts/blanc_xkeen_update_outbounds.sh
          sh -n deploy/S99freenet-ui

      - name: Installer contract
        run: |
          grep -q 'REPO="VoltickVL/FreeNet-Router"' install.sh
          grep -q 'releases/latest/download' install.sh
          grep -q 'SHA256SUMS' install.sh
          grep -q 'bootstrap_ip' install.sh
          grep -q '77.88.8.8 8.8.8.8' install.sh
          grep -q 'normalize_legacy_cron' install.sh
          grep -q '# BEGIN FREENET' install.sh
          grep -q 'abort_signal' install.sh
          grep -q 'ROLLBACK:' install.sh
          grep -q 'CONFIG_DIR="/opt/etc/freenet"' install.sh
          grep -q '/opt/etc/xray/blanc_subscription.url' install.sh
          grep -q 'snapshot_xray' install.sh
          grep -q 'LAN-only listener' install.sh
          ! grep -q 'setup.sh' install.sh
          grep -q 'cp install.sh dist/freenet' .github/workflows/release.yml
          grep -q '^v0\.' VERSION
          grep -q 'Stamp UI version from VERSION' .github/workflows/release.yml

      - name: Doctor contract
        run: |
          grep -q 'MUTATION=NONE' doctor.sh
          grep -q 'MODE=READY_EXISTING_STACK' doctor.sh
          grep -q 'MODE=ENTWARE_ONLY' doctor.sh
          grep -q 'xray run -test' doctor.sh
          ! grep -Eq '^[[:space:]]*(opkg[[:space:]]+(install|upgrade)|reboot([[:space:]]|$)|restart([[:space:]]|$)|killall([[:space:]]|$)|crontab[[:space:]]+[^-l])' doctor.sh

      - name: UI recovery contract
        run: |
          grep -q 'AbortController' freenet-ui/web/index.html
          grep -q 'actionFinishedByStatus' freenet-ui/web/index.html
          grep -q 'Соединение прервалось во время перезапуска VPN' freenet-ui/web/index.html
          grep -q 'setInterval(loadStatus,2000)' freenet-ui/web/index.html

      - name: Secret surface guard
        run: |
          ! grep -Rni --exclude='*_test.go' -E \
            'vless://[0-9A-Fa-f-]{36}@|withblancvpn\.online|87\.86\.183\.|46\.37\.141\.4|blanc_subscription\.url.*https?://|"publicKey"[[:space:]]*:[[:space:]]*"[^$]' \
            install.sh doctor.sh scripts config freenet-ui deploy README.md docs

      - name: Cross-build direct router binaries
        run: |
          mkdir -p dist
          (
            cd freenet-ui
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
              go build -trimpath -ldflags='-s -w' -o ../dist/freenet-ui-arm64-v8a .
          )
          (
            cd freenet-ui
            CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat \
              go build -trimpath -ldflags='-s -w' -o ../dist/freenet-ui-mips32le .
          )
          (
            cd freenet-ui
            CGO_ENABLED=0 GOOS=linux GOARCH=mips GOMIPS=softfloat \
              go build -trimpath -ldflags='-s -w' -o ../dist/freenet-ui-mips32 .
          )
          file dist/freenet-ui-*
          sha256sum dist/freenet-ui-*
