name: Patch 342 branch
on:
  push:
    branches:
      - "fix/342-final-overview-v035"
    paths:
      - ".github/workflows/patch-342.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/342-final-overview-v035"
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/patch342.py
      - name: Verify and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Overview: current baseline and compact VPN picker"
          git push origin HEAD:fix/342-final-overview-v035
