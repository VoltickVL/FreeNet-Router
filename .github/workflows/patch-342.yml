name: Patch 342 branch
on:
  push:
    branches: [fix/342-final-overview-v035]
    paths: [.github/workflows/patch-342.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/342-final-overview-v035
          fetch-depth: 0
      - name: Apply exact source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(s.replace(old, new, 1))

          # Full Best Server scan must establish a current baseline even when
          # current is Whitelist/specialized and therefore excluded from the
          # foreign alternative pool.
          old = '''\tcandidates := filterForeignBestServerCandidates(all)
\tif len(candidates) == 0 {
\t\treturn bestServerQualityResponse{
\t\t\tSuccess: true, Available: false, Candidates: []bestServerQualityCandidate{}, ProfilesScanned: 0, ProfilesTotal: 0,
\t\t\tProfilesTruncated: truncated, Mutation: "NONE", ScannedAt: time.Now().UTC().Format(time.RFC3339), CurrentEndpoint: currentEndpoint,
\t\t\tMessage: "Подходящих зарубежных Extra-профилей нет; российские и специализированные Whitelist-профили исключены из автоматического подбора.",
\t\t}, nil
\t}

\tprofilesScanned := len(candidates)
\tcachedCurrent, cachedOK := loadBestServerCurrentQuality(currentEndpoint, currentFilter)
\tif cachedOK {
\t\tif currentIndex := bestServerCurrentCandidateIndex(candidates, currentEndpoint, currentFilter); currentIndex >= 0 {
\t\t\tcandidates = withoutBestServerCandidate(candidates, currentIndex)
\t\t}
\t}
'''
          new = '''\tcandidates := filterForeignBestServerCandidates(all)
\tprofilesScanned := len(candidates)

\t// A full comparison must always have its own current baseline. Reuse a
\t// fresh complete baseline when available; otherwise measure the active live
\t// outbound before probing alternatives. This is independent of whether the
\t// current profile is eligible for the foreign alternative pool (for example
\t// a Whitelist profile). The measurement is read-only and never mutates VPN.
\tcurrentBaseline, currentBaselineOK := loadBestServerCurrentQuality(currentEndpoint, currentFilter)
\tcurrentBaselineCached := currentBaselineOK
\tif !currentBaselineOK {
\t\tbaselineCtx, cancelBaseline := context.WithTimeout(ctx, bestServerCurrentScanTimeout)
\t\tbaselineResponse := a.scanActiveCurrentVPNQuality(baselineCtx, currentEndpoint, currentFilter)
\t\tcancelBaseline()
\t\tif candidate, ok := currentBestServerQualityCandidate(baselineResponse); ok {
\t\t\tcurrentBaseline = candidate
\t\t\tcurrentBaselineOK = true
\t\t}
\t}
\tif currentIndex := bestServerCurrentCandidateIndex(candidates, currentEndpoint, currentFilter); currentIndex >= 0 {
\t\tcandidates = withoutBestServerCandidate(candidates, currentIndex)
\t}
\tif len(candidates) == 0 {
\t\tcurrentCandidates := []bestServerQualityCandidate{}
\t\tif currentBaselineOK {
\t\t\tcurrentCandidates = append(currentCandidates, currentBaseline)
\t\t}
\t\treturn bestServerQualityResponse{
\t\t\tSuccess: true, Available: currentBaselineOK && currentBaseline.Eligible, Candidates: currentCandidates, ProfilesScanned: profilesScanned, ProfilesTotal: profilesScanned,
\t\t\tProfilesTruncated: truncated, Mutation: "NONE", ScannedAt: time.Now().UTC().Format(time.RFC3339), CurrentEndpoint: currentEndpoint,
\t\t\tMessage: "Подходящих зарубежных Extra-профилей нет; текущий VPN сохранён и проверен отдельно от списка замен.",
\t\t}, nil
\t}
'''
          replace_once('freenet-ui/best_server_ux.go', old, new)

          old = '''\tresponse := a.rankMeasuredBestServerBatches(ctx, candidates, profilesScanned, truncated, currentEndpoint, currentFilter)
\tif ctx.Err() != nil && len(response.Candidates) == 0 {
\t\treturn bestServerQualityResponse{}, ctx.Err()
\t}
\tif cachedOK {
\t\tresponse.Candidates = append(response.Candidates, cachedCurrent)
\t} else if candidate, ok := currentBestServerQualityCandidate(response); ok {
\t\tstoreBestServerCurrentQuality(currentEndpoint, currentFilter, candidate)
\t}
'''
          new = '''\tresponse := a.rankMeasuredBestServerBatches(ctx, candidates, profilesScanned, truncated, currentEndpoint, currentFilter)
\tif ctx.Err() != nil && len(response.Candidates) == 0 && !currentBaselineOK {
\t\treturn bestServerQualityResponse{}, ctx.Err()
\t}
\tif currentBaselineOK {
\t\tresponse.Candidates = append(response.Candidates, currentBaseline)
\t\tif !currentBaselineCached {
\t\t\tstoreBestServerCurrentQuality(currentEndpoint, currentFilter, currentBaseline)
\t\t}
\t}
'''
          replace_once('freenet-ui/best_server_ux.go', old, new)
          replace_once('freenet-ui/best_server_ux.go', '''\tif cachedOK {
\t\tresponse.Message += " Свежий подтверждённый замер текущего VPN переиспользован без повторной тяжёлой Speedtest-проверки."
\t}
''', '''\tif currentBaselineCached {
\t\tresponse.Message += " Свежий подтверждённый замер текущего VPN переиспользован без повторной тяжёлой Speedtest-проверки."
\t} else if currentBaselineOK {
\t\tresponse.Message += " Текущий VPN измерен в рамках этого полного сравнения."
\t}
''')

          # Move the actual manual search + VPN selector to the Overview topbar.
          js = 'freenet-ui/web/operation-coordinator.js'
          old = '''    const guard = qs('#quickNetworkGuard');
    let manual = qs('#bestServerAdvanced');
    if (profilesList && !manual) {
      manual = document.createElement('section'); manual.id = 'bestServerAdvanced';
      const title = document.createElement('h3'); title.textContent = 'Выбор сервера вручную'; manual.appendChild(title);
      quick.parentNode.insertBefore(manual, quick.nextSibling);
    }
    if (manual && quick.parentNode && manual.parentNode !== quick.parentNode) quick.parentNode.insertBefore(manual, quick.nextSibling);
    if (manual && profilesList && profilesList.parentNode !== manual) manual.appendChild(profilesList);
    const exact = qs('#exactConnectRow'); if (manual && exact && exact.parentNode !== manual) manual.appendChild(exact);
    if (manual && guard && guard.parentNode !== manual) manual.appendChild(guard);
'''
          new = '''    const guard = qs('#quickNetworkGuard');
    let manual = qs('#bestServerAdvanced');
    const topbar = qs('.topbar.overview-approved') || qs('.topbar');
    const topSummary = qs('#overviewApprovedTop');
    const topActions = qs('.top-actions');
    if (profilesList && !manual) {
      manual = document.createElement('section'); manual.id = 'bestServerAdvanced';
    }
    if (manual) manual.classList.add('fn-topbar-vpn-picker');
    if (manual && topbar && manual.parentNode !== topbar) topbar.insertBefore(manual, topSummary || topActions || null);
    if (manual && profilesList && profilesList.parentNode !== manual) manual.appendChild(profilesList);
    const exact = qs('#exactConnectRow'); if (manual && exact && exact.parentNode !== manual) manual.appendChild(exact);
    if (manual && guard && guard.parentNode !== manual) manual.appendChild(guard);
'''
          replace_once(js, old, new)

          old = '''  function polishTopbar() {
    const status = q('#topStatus');
    const dot = q('#topDot');
    if (status) {
      const current = status.textContent.trim();
      if (current === 'VPN + DNS OK' || current === 'VPN OK · DNS напрямую' || (dot && dot.classList.contains('ok') && current !== 'Нет связи')) status.textContent = 'Всё работает';
      status.closest('.top-status')?.classList.add('fn-health-pill');
    }
    const actions = q('.top-actions');
    const manual = q('#bestServerAdvanced');
    if (actions && manual && !q('#fnManualShortcut')) {
      const button = document.createElement('button');
      button.id = 'fnManualShortcut';
      button.type = 'button';
      button.className = 'fn-manual-shortcut';
      button.textContent = 'Сервер вручную';
      button.addEventListener('click', () => {
        manual.scrollIntoView({behavior: 'smooth', block: 'center'});
        window.setTimeout(() => q('#profileSearch')?.focus(), 280);
      });
      const link = q('#topXkeenLink');
      actions.insertBefore(button, link || actions.firstChild);
    }
  }
'''
          new = '''  function polishTopbar() {
    q('#fnManualShortcut')?.remove();
    const manual = q('#bestServerAdvanced');
    const topbar = q('.topbar.overview-approved') || q('.topbar');
    const summary = q('#overviewApprovedTop');
    const actions = q('.top-actions');
    if (manual) manual.classList.add('fn-topbar-vpn-picker');
    if (manual && topbar && manual.parentNode !== topbar) topbar.insertBefore(manual, summary || actions || null);
    const exact = q('#exactConnectRow'); if (manual && exact && exact.parentNode !== manual) manual.appendChild(exact);
  }
'''
          replace_once(js, old, new)

          old = '''      .top-actions{gap:10px!important}.top-status.fn-health-pill{display:inline-flex!important;align-items:center;gap:8px;padding:6px 10px;border:1px solid #29445f;border-radius:999px;background:#0b1828;color:#c8d7e8!important;white-space:nowrap}.top-status.fn-health-pill .dot{margin:0}.top-status.fn-health-pill .dot.ok{background:#36e3a2!important;box-shadow:0 0 12px rgba(54,227,162,.58)!important}.fn-manual-shortcut{min-height:34px;padding:6px 11px;border:1px solid #315276;border-radius:9px;background:#0d1c2e;color:#c7d6e7;font:700 11px/1 inherit;cursor:pointer;white-space:nowrap}.fn-manual-shortcut:hover{border-color:#5286bd;background:#11243a;color:#fff}.fn-manual-shortcut:focus-visible{outline:2px solid #6aa2ff;outline-offset:2px}
      #bestServerAdvanced{border-top:1px solid #233b55;padding-top:12px!important;margin-top:0!important}.overview-approved-top{gap:24px!important}
      @media(max-width:1180px){.vpn-current-panel .best-v4-pill b{font-size:16.5px!important}.vpn-current-panel .best-v4-pill b.fn-long-value{font-size:15px!important}.fn-manual-shortcut{display:none}}
      @media(max-width:820px){.vpn-current-panel .best-v4-pill b,.vpn-current-panel .best-v4-pill b.fn-long-value{font-size:15px!important;letter-spacing:-.035em}.top-status.fn-health-pill{padding:5px 8px}}
      @media(min-width:821px) and (max-height:820px){.vpn-current-panel .best-v4-pill b,.vpn-current-panel .best-v4-pill b.fn-long-value{font-size:13px!important;letter-spacing:-.03em}}
'''
          new = '''      .top-actions{gap:10px!important}.topbar.overview-approved{overflow:visible!important;gap:14px!important}.topbar.overview-approved .top-status{display:none!important}.overview-approved-top{margin-left:0!important;gap:18px!important}
      #bestServerAdvanced.fn-topbar-vpn-picker{position:relative;display:block!important;flex:1 1 560px;max-width:620px;min-width:390px;margin:0 0 0 auto!important;padding:0!important;border:0!important;background:transparent!important;min-height:0!important;z-index:60}#bestServerAdvanced.fn-topbar-vpn-picker:before,#bestServerAdvanced.fn-topbar-vpn-picker>h3{display:none!important}
      #bestServerAdvanced.fn-topbar-vpn-picker #profilesList.profiles{display:grid!important;grid-template-columns:minmax(170px,.82fr) minmax(220px,1.18fr);gap:8px;align-items:center;width:100%;margin:0!important;min-height:0!important}#bestServerAdvanced.fn-topbar-vpn-picker #profilesList .field{position:relative;padding:0;border:0;background:none;min-height:0!important}#bestServerAdvanced.fn-topbar-vpn-picker #profilesList .field label{display:none!important}#bestServerAdvanced.fn-topbar-vpn-picker #profilesList .profile-combobox{margin:0!important;min-height:0!important;position:relative}#bestServerAdvanced.fn-topbar-vpn-picker #profileSearch,#bestServerAdvanced.fn-topbar-vpn-picker #profilesTrigger{min-height:36px!important;height:36px!important;background:#0b1929;border:1px solid #315276;border-radius:9px;font-size:11px;color:#dce8f7}#bestServerAdvanced.fn-topbar-vpn-picker #profileSearch{padding-left:38px}#bestServerAdvanced.fn-topbar-vpn-picker .manual-search-icon{left:11px;width:16px;height:16px}#bestServerAdvanced.fn-topbar-vpn-picker #profilesMenu{z-index:120}#bestServerAdvanced.fn-topbar-vpn-picker #profilesError{grid-column:1/-1;margin:0;position:absolute;top:42px;left:0;right:0;z-index:122}#bestServerAdvanced.fn-topbar-vpn-picker #selectedProfileCard{position:absolute;top:43px;left:0;right:222px;z-index:121;margin:0;padding:8px 10px;border:1px solid #315276;border-radius:10px;background:#0c1a2b;box-shadow:0 12px 30px rgba(0,0,0,.38);font-size:10px}#bestServerAdvanced.fn-topbar-vpn-picker:has(#exactConnectRow[hidden]) #selectedProfileCard{display:none!important}#bestServerAdvanced.fn-topbar-vpn-picker #exactConnectRow{position:absolute;top:43px;right:0;z-index:122;width:214px;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0;padding:7px;border:1px solid #315276;border-radius:10px;background:#0c1a2b;box-shadow:0 12px 30px rgba(0,0,0,.38)}#bestServerAdvanced.fn-topbar-vpn-picker #exactConnectRow[hidden]{display:none!important}#bestServerAdvanced.fn-topbar-vpn-picker #exactConnectRow .btn{min-height:34px;padding:5px 7px;font-size:9px}#bestServerAdvanced.fn-topbar-vpn-picker #quickNetworkGuard{display:none!important}
      @media(max-width:1180px){.vpn-current-panel .best-v4-pill b{font-size:16.5px!important}.vpn-current-panel .best-v4-pill b.fn-long-value{font-size:15px!important}#bestServerAdvanced.fn-topbar-vpn-picker{min-width:320px;max-width:520px}.overview-approved-top{gap:12px!important}.overview-approved-fact span{font-size:9px!important}.overview-approved-fact strong{font-size:11px!important}}
      @media(max-width:900px){.overview-approved-top{display:none!important}#bestServerAdvanced.fn-topbar-vpn-picker{max-width:none;min-width:300px}}
      @media(max-width:820px){.vpn-current-panel .best-v4-pill b,.vpn-current-panel .best-v4-pill b.fn-long-value{font-size:15px!important;letter-spacing:-.035em}.topbar.overview-approved{height:auto!important;min-height:64px;flex-wrap:wrap;padding-bottom:8px!important}#bestServerAdvanced.fn-topbar-vpn-picker{order:20;flex:1 0 100%;max-width:none;min-width:0;margin:0!important}#bestServerAdvanced.fn-topbar-vpn-picker #profilesList.profiles{grid-template-columns:1fr 1.15fr}}
      @media(max-width:560px){#bestServerAdvanced.fn-topbar-vpn-picker #profilesList.profiles{grid-template-columns:1fr}#bestServerAdvanced.fn-topbar-vpn-picker #selectedProfileCard,#bestServerAdvanced.fn-topbar-vpn-picker #exactConnectRow{position:static;width:auto;grid-column:1/-1;margin-top:6px}#bestServerAdvanced.fn-topbar-vpn-picker #profilesError{position:static;grid-column:1/-1}}
      @media(min-width:821px) and (max-height:820px){.vpn-current-panel .best-v4-pill b,.vpn-current-panel .best-v4-pill b.fn-long-value{font-size:13px!important;letter-spacing:-.03em}}
'''
          replace_once(js, old, new)

          # User-facing selector wording.
          replace_once('freenet-ui/web/index.html', "extraProfiles.length?'Выбрать конкретный Extra-профиль':'Профили не загружены'", "extraProfiles.length?'Выбрать VPN':'Профили не загружены'")

          # Update the runtime polish contract to the new final topbar behavior.
          test = Path('freenet-ui/overview_runtime_polish_test.go')
          test.write_text('''package main\n\nimport (\n\t"os"\n\t"strings"\n\t"testing"\n)\n\nfunc TestOverviewRuntimePolishContract(t *testing.T) {\n\tdata, err := os.ReadFile("web/operation-coordinator.js")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\ts := string(data)\n\tmustContain := []string{\n\t\t"FreeNetFinalRuntimePolish",\n\t\t"fn-best-alternative",\n\t\t"Лучший из вариантов",\n\t\t"fn-clean-flag",\n\t\t"flagSVG",\n\t\t"fn-long-value",\n\t\t"fn-topbar-vpn-picker",\n\t\t"topbar.insertBefore(manual, topSummary || topActions || null)",\n\t\t".topbar.overview-approved .top-status{display:none!important}",\n\t\t"vpn-current-panel .best-v4-pill{grid-template-columns:20px minmax(0,1fr)!important",\n\t\t".flag-icon.fn-clean-flag:before,.flag-icon.fn-clean-flag:after{content:none!important",\n\t\t"hr: '<rect width=\\"30\\" height=\\"6.667\\" fill=\\"#ff0000\\"",\n\t\t"sk: '<rect width=\\"30\\" height=\\"6.667\\" fill=\\"#fff\\"",\n\t\t"ru: '<rect width=\\"30\\" height=\\"6.667\\" fill=\\"#fff\\"",\n\t\t"dk: '<rect width=\\"30\\" height=\\"20\\" fill=\\"#c8102e\\"",\n\t\t"no: '<rect width=\\"30\\" height=\\"20\\" fill=\\"#ba0c2f\\"",\n\t}\n\tfor _, needle := range mustContain {\n\t\tif !strings.Contains(s, needle) {\n\t\t\tt.Fatalf("runtime Overview polish contract missing %q", needle)\n\t\t}\n\t}\n\tfor _, forbidden := range []string{"Всё работает", "Сервер вручную", "fn-health-pill", "fn-manual-shortcut"} {\n\t\tif strings.Contains(s, forbidden) {\n\t\t\tt.Fatalf("obsolete Overview topbar UI still present: %q", forbidden)\n\t\t}\n\t}\n\n\tindex, err := os.ReadFile("web/index.html")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif !strings.Contains(string(index), "extraProfiles.length?'Выбрать VPN':'Профили не загружены'") {\n\t\tt.Fatal("manual VPN selector must use user-facing label 'Выбрать VPN'")\n\t}\n}\n''')

          Path('freenet-ui/best_server_full_current_test.go').write_text('''package main\n\nimport (\n\t"os"\n\t"strings"\n\t"testing"\n)\n\nfunc TestFullBestServerScanOwnsCurrentBaseline(t *testing.T) {\n\tdata, err := os.ReadFile("best_server_ux.go")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\ts := string(data)\n\tfor _, want := range []string{\n\t\t"currentBaseline, currentBaselineOK := loadBestServerCurrentQuality",\n\t\t"baselineResponse := a.scanActiveCurrentVPNQuality",\n\t\t"response.Candidates = append(response.Candidates, currentBaseline)",\n\t\t"currentIndex := bestServerCurrentCandidateIndex(candidates, currentEndpoint, currentFilter)",\n\t} {\n\t\tif !strings.Contains(s, want) {\n\t\t\tt.Fatalf("full Best Server current-baseline contract missing %q", want)\n\t\t}\n\t}\n\tif strings.Contains(s, "if cachedOK {\\n\\t\\tif currentIndex := bestServerCurrentCandidateIndex") {\n\t\tt.Fatal("current removal must not depend on a pre-existing cache")\n\t}\n}\n''')

          # The patch workflow is implementation scaffolding only; do not leave
          # it in the product PR.
          Path('.github/workflows/patch-342.yml').unlink()
          PY
          git diff --check
          git status --short
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Overview: current baseline and compact VPN picker"
          git push origin HEAD:fix/342-final-overview-v035
