name: Manual recovery source authoring
on:
  push:
    branches: [fix/beta08-manual-recovery-lifecycle]
    paths: [.github/workflows/author-manual-once.yml]
permissions:
  contents: write
jobs:
  author:
    if: github.repository == 'VoltickVL/FreeNet-Router'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: freenet-ui/go.mod
      - name: Apply exact reviewed source edits
        run: |
          python3 scripts/.task-manual.py
          gofmt -w freenet-ui/manual_recovery_inventory.go freenet-ui/manual_recovery_inventory_test.go
          sh -n scripts/apply_provider_profile.sh
          sh tests/test_provider_profile_apply.sh
          sh tests/test_manual_vpn_recovery.sh
          (cd freenet-ui && go test -run 'Test(Manual|LocalManual|VPNTransaction|LiveXray|AutomationApplyFailure)' -count=1 ./...)
      - name: Commit source and targeted tests
        run: |
          git config user.name 'FreeNet source authoring'
          git config user.email 'actions@users.noreply.github.com'
          git add freenet-ui/manual_recovery_inventory.go freenet-ui/manual_recovery_inventory_test.go freenet-ui/manual_provider_selection_test.go freenet-ui/network_apply_api.go freenet-ui/vpn_transaction_doctor.go scripts/apply_provider_profile.sh tests/test_provider_profile_apply.sh tests/test_manual_vpn_recovery.sh
          git commit -m 'fix(vpn): repeatable protected manual recovery with stopped-core support'
          git push origin HEAD:fix/beta08-manual-recovery-lifecycle
