name: FreeNet UI state patch staging
on:
  push:
    branches: [fix/beta08-ui-control-state-ownership]
    paths: [.github/workflows/ui-state-stage.yml]
permissions:
  contents: write
concurrency:
  group: freenet-ui-state-staging
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply narrow component ownership edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def once(s,a,b):
              assert s.count(a)==1, a[:120]
              return s.replace(a,b,1)
          changes = {}
          p=Path('freenet-ui/web/index.html');s=p.read_text()
          s=once(s,"if(!b.closest('#bestServerShell')&&b.id!==", "if(!b.closest('#bestServerShell,.cs-shell')&&b.id!==")
          changes[p]=s
          p=Path('freenet-ui/web/config-studio-parity.js');s=p.read_text()
          s=once(s,'    mounted: false,','    mounted: false,\n    externalBusy: false,\n    applying: false,')
          s=once(s,'    const format = qs(\'#csFormat\'), reset = qs(\'#csReset\'), apply = qs(\'#csApply\');','    const blocked = state.externalBusy || state.applying;\n    const input = qs(\'#csInput\');\n    if (input) input.readOnly = blocked;\n    document.querySelectorAll(\'.cs-shell .cs-tab\').forEach(button => { button.disabled = blocked; });\n    const format = qs(\'#csFormat\'), reset = qs(\'#csReset\'), apply = qs(\'#csApply\');')
          s=once(s,'if (format) format.disabled = !jsonEditable || listTab;', 'if (format) format.disabled = !jsonEditable || listTab || blocked;')
          s=once(s,'if (reset) reset.disabled = !jsonEditable || !dirty;', 'if (reset) reset.disabled = !jsonEditable || !dirty || blocked;')
          s=once(s,'apply.disabled = !jsonEditable || !dirty || hasError || state.stale;', 'apply.disabled = !jsonEditable || !dirty || hasError || state.stale || blocked;')
          s=once(s,'  function formatActive() {','  function formatActive() {\n    if (state.externalBusy || state.applying) return;')
          s=once(s,'  function resetActive() {','  function resetActive() {\n    if (state.externalBusy || state.applying) return;')
          s=once(s,'if (!tab || !isDirty(tab.name) || state.errors.has(tab.name) || state.stale) return;', 'if (!tab || !isDirty(tab.name) || state.errors.has(tab.name) || state.stale || state.externalBusy || state.applying) return;')
          s=once(s,'    const appliedTab = tab.name;', '    state.applying = true;\n    renderStatusAndActions();\n    const appliedTab = tab.name;')
          s=once(s,"      if (button) button.textContent = 'Применить';\n      renderStatusAndActions();", "      state.applying = false;\n      if (button) button.textContent = 'Применить';\n      renderStatusAndActions();")
          anchor="  document.addEventListener('freenet:xray-config-applied', event => { void handleExternalConfigApplied(event); });"
          s=once(s,anchor,"  // The editor owns its disabled state; background polling cannot clear STALE.\n  document.addEventListener('freenet:controls-busy', event => {\n    state.externalBusy = !!event.detail;\n    renderStatusAndActions();\n  });\n\n"+anchor)
          changes[p]=s
          p=Path('freenet-ui/web/self-update.js');s=p.read_text()
          s=once(s,"    control.id = 'topFreenetUpdate';", "    control.id = 'topFreenetUpdate';\n    // Semantic content exists before asynchronous version requests complete.\n    // Unknown is explicit; never create a blank version control during login/remount.\n    control.innerHTML = '<span class=\"fn-version-icon\" aria-hidden=\"true\">◈</span><span class=\"fn-version-copy\"><small>FreeNet</small><strong>—</strong></span>';")
          changes[p]=s
          p=Path('tests/test_config_studio_parity.cjs');s=p.read_text()
          anchor="    assert.match(await page.locator('#csInput').inputValue(),/draft\\.test/);"
          s=once(s,anchor,anchor+"\n    // Reproduce the former global poll overwriting the editor-owned STOP.\n    await page.evaluate(() => buttonsBusy(false));\n    assert.equal(await page.locator('#csApply').isDisabled(),true,'idle status poll must preserve STALE');")
          anchor="    assert.match(await page.locator('#csInput').inputValue(),new RegExp('late-draft[.]test'),'late read must not overwrite draft');"
          s=once(s,anchor,anchor+"\n    await page.evaluate(() => { buttonsBusy(true); buttonsBusy(false); });\n    assert.equal(await page.locator('#csApply').isDisabled(),true,'busy/idle polling must not erase the stale draft guard');")
          anchor="    await page.locator('#csApply').click();"
          assert s.count(anchor)>=1
          s=s.replace(anchor,"    await page.evaluate(() => buttonsBusy(true));\n    assert.equal(await page.locator('#csApply').isDisabled(),true,'editor must observe an external mutation');\n    await page.evaluate(() => buttonsBusy(false));\n"+anchor,1)
          changes[p]=s
          assert len(changes)==4
          for p,s in changes.items():
              p.write_text(s)
              print(p)
          PY
          node --check freenet-ui/web/config-studio-parity.js
          node --check freenet-ui/web/self-update.js
          node --check tests/test_config_studio_parity.cjs
      - name: Guard and commit isolated UI task
        run: |
          test "$(git ls-remote origin refs/heads/fix/beta08-ui-control-state-ownership | cut -f1)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add freenet-ui/web/index.html freenet-ui/web/config-studio-parity.js freenet-ui/web/self-update.js tests/test_config_studio_parity.cjs
          git diff --cached --stat
          git commit -m 'fix(ui): preserve editor safety state and render version label immediately'
          git push origin HEAD:refs/heads/fix/beta08-ui-control-state-ownership
