name: Diagnose DNS assignment rollback

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'fix/dns-split-disable-native-assignments'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dns-split-disable-native-assignments
      - name: Apply patch and trace rollback verification
        shell: bash
        run: |
          awk '
            /python3 - <<.PY./ {capture=1; next}
            capture && /^          PY$/ {capture=0; exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/zz-dns-assignment-fix.yml > /tmp/freenet-dns-patch.py
          python3 /tmp/freenet-dns-patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_network_profile.sh')
          s=p.read_text()
          s=s.replace('restore_runtime() {\n', 'restore_runtime() {\n    set -x\n', 1)
          p.write_text(s)
          p=Path('tests/test_network_profile_contract.sh')
          s=p.read_text()
          needle="grep -Fq 'ROLLBACK ERROR/STATE: rollback success' \"$TMP/fail.apply\" || fail 'rollback success missing'"
          diag="echo '--- fail.apply diagnostic ---'; cat \"$TMP/fail.apply\"; echo '--- state diagnostic ---'; cat \"$STATE\"; echo '--- end diagnostic ---'; "
          s=s.replace(needle, diag+needle, 1)
          p.write_text(s)
          PY
          sh tests/test_network_profile_contract.sh
