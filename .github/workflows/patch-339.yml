name: Patch 339 branch
on:
  push:
    branches:
      - fix/339-best-server-targeted-refresh
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/339-best-server-targeted-refresh
      - name: Apply deterministic patch
        run: python3 .github/patch339.py
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Best Server: wire targeted retry and quality-gated refresh UI'
          git push origin HEAD:fix/339-best-server-targeted-refresh
