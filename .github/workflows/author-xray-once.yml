name: Xray status hydration source authoring
on:
  push:
    branches: [fix/beta08-xray-status-hydration]
    paths: [.github/workflows/author-xray-once.yml]
permissions:
  contents: write
jobs:
  author:
    if: github.repository == 'VoltickVL/FreeNet-Router'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed source edits
        run: |
          python3 scripts/.task-xray-hydration.py
          node --check freenet-ui/web/xray-core-manager.js
          node tests/test_xray_topbar_lifecycle.cjs
      - name: Commit source only
        run: |
          git config user.name 'FreeNet source authoring'
          git config user.email 'actions@users.noreply.github.com'
          git add freenet-ui/web/index.html freenet-ui/web/xray-core-manager.js
          git commit -m 'fix(ui): hydrate Xray status after authentication and topbar remount'
          git push origin HEAD:fix/beta08-xray-status-hydration
