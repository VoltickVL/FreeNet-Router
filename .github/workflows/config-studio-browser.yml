name: FreeNet Config Studio Browser CI

on:
  pull_request:
    paths:
      - 'freenet-ui/**'
      - 'tests/test_config_studio_parity.cjs'
      - '.github/workflows/config-studio-browser.yml'

permissions:
  contents: read

jobs:
  config-studio-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/freenet-config-studio-browser" --no-package-lock --ignore-scripts playwright@1.51.1
          node "$RUNNER_TEMP/freenet-config-studio-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Config Studio highlighted editor and controlled apply
        env:
          NODE_PATH: ${{ runner.temp }}/freenet-config-studio-browser/node_modules
        run: node tests/test_config_studio_parity.cjs
