name: Issue 347 Codemod v2

on:
  push:
    branches: [fix/347-overview-render-contract]

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/347-overview-render-contract
          fetch-depth: 0
      - name: Apply codemod
        run: python3 scripts/issue347_codemod.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align Overview with approved render contract (#347)"
          git push origin HEAD:fix/347-overview-render-contract
