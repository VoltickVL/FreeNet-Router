name: Update lifecycle authoring workspace
on:
  push:
    branches: [fix/beta08-update-lifecycle]
    paths: [.github/workflows/author-update-once.yml]
permissions:
  contents: write
jobs:
  workspace:
    if: github.repository == 'VoltickVL/FreeNet-Router'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: freenet-ui/go.mod
      - name: Apply exact reviewed source edits
        run: |
          python3 scripts/.task-update.py
          python3 scripts/.task-update-release.py
          gofmt -w freenet-ui/self_update_admission.go freenet-ui/self_update_admission_test.go freenet-ui/self_update_operation_slot.go freenet-ui/self_update_lock.go
          sh -n scripts/self_update.sh
          sh tests/test_self_update.sh
          sh tests/test_self_update_lifecycle.sh
          (cd freenet-ui && go test -run 'Test(PendingVPNDoesNotBlock|UpdateAdmission|TemporaryVerifiedUpdater|StaleUpdaterCan|SelfUpdateLifecycle|SelfUpdate|UpdateLock|BrowserRecovery|Recovery)' -count=1 ./...)
      - name: Record audited source changes only
        run: |
          git config user.name 'FreeNet source authoring'
          git config user.email 'actions@users.noreply.github.com'
          git add freenet-ui/main.go freenet-ui/self_update_admission.go freenet-ui/self_update_admission_test.go freenet-ui/self_update_operation_slot.go freenet-ui/self_update_lock.go freenet-ui/self_update_recovery.go scripts/self_update.sh tests/test_self_update_lifecycle.sh .github/next-release.yml
          git commit -m 'fix(update): independent checkpoint-preserving transactional application lifecycle'
          git push origin HEAD:fix/beta08-update-lifecycle
