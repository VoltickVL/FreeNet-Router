name: FreeNet Login Lifecycle CI
on:
  pull_request:
    paths:
      - 'freenet-ui/auth*.go'
      - 'freenet-ui/recovery*.go'
      - 'freenet-ui/web/index.html'
      - 'freenet-ui/web/accepted-ux.js'
      - 'tests/test_auth_session_lifecycle.cjs'
      - '.github/workflows/auth-session-browser.yml'
permissions:
  contents: read
concurrency:
  group: freenet-login-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  session-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Canonical login persistence and stale-response regression
        run: node tests/test_auth_session_lifecycle.cjs
