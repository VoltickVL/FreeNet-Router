name: v0.3.8 UI codemod
on:
  push:
    branches: [fix/353-v038-ui-polish]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/353-v038-ui-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply UI polish
        run: python .github/scripts/apply_v038.py
      - name: Commit product diff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: polish Overview actions, sidebar and topbar (#353)"
          git push origin HEAD:fix/353-v038-ui-polish
