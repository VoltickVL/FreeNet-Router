name: FreeNet auth base synchronization
on:
  push:
    branches: [fix/beta08-persistent-login-lifecycle]
    paths: [.github/workflows/auth-base-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge only the accepted UI prerequisite
        env:
          BASE: c68b0fee5519b96f8c0fb9080ed47fb8a1adbca0
        run: |
          test "$(git ls-remote origin refs/heads/beta/v0.8.0 | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/fix/beta08-persistent-login-lifecycle | cut -f1)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-ff --no-commit "$BASE"
          node tests/test_auth_session_lifecycle.cjs
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--name-only','c68b0fee5519b96f8c0fb9080ed47fb8a1adbca0']).decode().splitlines())
          expected={'.github/workflows/auth-base-sync.yml','.github/workflows/auth-session-browser.yml','freenet-ui/auth_persistence_lifecycle_test.go','freenet-ui/recovery.go','freenet-ui/web/index.html','tests/test_auth_session_lifecycle.cjs'}
          assert paths==expected, paths
          from pathlib import Path
          s=Path('freenet-ui/web/index.html').read_text()
          assert "closest('#bestServerShell,.cs-shell')" in s
          assert 'let authStatusGeneration=0;' in s
          assert 'id="authRemember" type="checkbox" checked' in s
          print('Auth scope and accepted component ownership preserved')
          PY
          git commit -m 'merge(beta): accepted UI control ownership prerequisite'
          git push origin HEAD:refs/heads/fix/beta08-persistent-login-lifecycle
