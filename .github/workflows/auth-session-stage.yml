name: FreeNet auth patch staging
on:
  push:
    branches: [fix/beta08-persistent-login-lifecycle]
    paths: [.github/workflows/auth-session-stage.yml]
permissions:
  contents: write
concurrency:
  group: freenet-auth-session-staging
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
      - name: Apply reviewed patch with before and after SHA-256 checks
        env:
          PATCH_DATA: 
        run: |
          python3 - <<'PY'
          import os, json, base64, gzip, hashlib
          from pathlib import Path
          data = json.loads(gzip.decompress(base64.b64decode(os.environ['PATCH_DATA'])))
          allowed = {'freenet-ui/web/index.html', 'freenet-ui/recovery.go', 'freenet-ui/auth_remember_test.go', 'tests/test_auth_session_lifecycle.cjs'}
          assert {f['path'] for f in data} == allowed and len(data) == 4
          sha = lambda text: hashlib.sha256(text.encode()).hexdigest()
          for f in data:
              p = Path(f['path'])
              assert p.exists() == f['oldExists'], f['path']
              source = p.read_text() if p.exists() else ''
              assert sha(source) == f['old'], f['path']
              lines = source.split('\n')
              for h in reversed(f['hunks']):
                  at = h['at']
                  assert lines[at:at+len(h['old'])] == h['old']
                  lines[at:at+len(h['old'])] = h['next']
              result = '\n'.join(lines)
              assert sha(result) == f['next'], f['path']
              p.write_text(result)
              print(f['path'], sha(result))
          PY
      - name: Validate scoped change before branch commit
        run: |
          gofmt -w freenet-ui/auth_remember_test.go freenet-ui/recovery.go
          node tests/test_auth_session_lifecycle.cjs
          cd freenet-ui
          go test -run 'Test(Remember|NonRemember|RecoveryRemember|Session|Auth|RequireAuth)' -count=1 ./...
      - name: Commit only session task files without force push
        run: |
          test "$(git ls-remote origin refs/heads/fix/beta08-persistent-login-lifecycle | cut -f1)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add freenet-ui/web/index.html freenet-ui/recovery.go freenet-ui/auth_remember_test.go tests/test_auth_session_lifecycle.cjs
          git diff --cached --stat
          git commit -m 'fix(auth): persistent 30-day login and resilient session status'
          git push origin HEAD:refs/heads/fix/beta08-persistent-login-lifecycle
