name: FreeNet auth patch staging
on:
  push:
    branches: [fix/beta08-persistent-login-lifecycle]
    paths: [.github/workflows/auth-session-stage.yml]
permissions:
  contents: write
concurrency:
  group: freenet-auth-session-staging
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache: false
      - name: Apply exact reviewed auth source changes
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          def replace_once(text, old, new):
              assert text.count(old) == 1, old[:100]
              return text.replace(old, new, 1)
          def blob(text):
              b = text.encode()
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          p = Path('freenet-ui/web/index.html')
          source = p.read_text()
          source = replace_once(source, '    <div class="auth-actions"><button id="authSubmitBtn"', '    <label id="authRememberRow" class="fn-remember"><input id="authRemember" type="checkbox" checked><span>Оставаться в системе 30 дней</span></label>\n    <div class="auth-actions"><button id="authSubmitBtn"')
          old_status = [l for l in source.splitlines() if l.startswith('async function loadAuthStatus()')]
          old_submit = [l for l in source.splitlines() if l.startswith('async function submitAuth()')]
          assert len(old_status) == len(old_submit) == 1
          status = '''let authStatusGeneration=0;
          let authSubmitting=false;
          async function loadAuthStatus(){
            const generation=++authStatusGeneration;
            try{
              const r=await fetch('/api/auth/status',{cache:'no-store',credentials:'include'});
              if(!r.ok)throw new Error("auth status unavailable");
              const s=await r.json();
              if(!s||typeof s.configured!=="boolean"||typeof s.authenticated!=="boolean")throw new Error("invalid auth status");
              if(generation!==authStatusGeneration)return;
              renderAuth(s);
            }catch(e){
              if(generation!==authStatusGeneration)return;
              // A proxy/network error is not proof that a valid login expired.
              if(!authAuthenticated){el("authSection").hidden=false;showBox("authNotice","Нет связи с FreeNet. Состояние входа пока не подтверждено.","bad")}
            }
          }'''
          submit = '''async function submitAuth(){
            if(authSubmitting)return;
            hideBox("authNotice");
            const password=el("authPassword").value,confirm=el("authPasswordConfirm").value;
            if(!authConfigured&&password!==confirm){showBox("authNotice","Пароли не совпадают","bad");return}
            const path=authConfigured?"/api/auth/login":"/api/auth/setup";
            const remember=!!el("authRemember")?.checked;
            authSubmitting=true;++authStatusGeneration;el("authSubmitBtn").disabled=true;
            try{
              const r=await fetch(path,{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({password,remember})}),j=await r.json();
              if(!r.ok||!j||j.configured!==true||j.authenticated!==true){showBox("authNotice",j?.error||"Ошибка авторизации","bad");return}
              ++authStatusGeneration;
              el("authPassword").value="";el("authPasswordConfirm").value="";
              renderAuth(j);
            }catch(e){showBox("authNotice","Нет связи с FreeNet","bad")}
            finally{authSubmitting=false;el("authSubmitBtn").disabled=false}
          }'''
          source = replace_once(source, old_status[0], status)
          source = replace_once(source, old_submit[0], submit)
          q = Path('freenet-ui/recovery.go')
          recovery = q.read_text()
          recovery = replace_once(recovery, 'json.Marshal(passwordRequest{Password: password})', 'json.Marshal(passwordRequest{Password: password, Remember: r.FormValue("remember") == "yes"})')
          password = '<input id="password" name="password" type="password" minlength="12" maxlength="256" required autocomplete="current-password">'
          recovery = replace_once(recovery, password, password+'\n<label class="remember"><input name="remember" type="checkbox" value="yes" checked> Оставаться в системе 30 дней</label>')
          recovery = replace_once(recovery, 'input:focus{border-color:#68a8ff}', 'input:focus{border-color:#68a8ff}\n.remember{display:flex;align-items:center;gap:9px;margin-top:12px}.remember input{width:18px;height:18px;flex:none}')
          assert blob(source) == '0c63105417d85f5886213043734626fb91fe1a4c', blob(source)
          assert blob(recovery) == '3475c91ed54d5f7975ba673cb9b722c77c67373b', blob(recovery)
          p.write_text(source)
          q.write_text(recovery)
          print('Verified local-tested source hashes; only canonical login and Recovery changed')
          PY
      - name: Validate source and focused auth regression
        run: |
          gofmt -w freenet-ui/auth_persistence_lifecycle_test.go freenet-ui/recovery.go
          node tests/test_auth_session_lifecycle.cjs
          cd freenet-ui
          go test -run 'Test(Remember|NonRemember|RecoveryRemember|Session|Auth|RequireAuth)' -count=1 ./...
      - name: Commit source to isolated branch with expected-head guard
        run: |
          test "$(git ls-remote origin refs/heads/fix/beta08-persistent-login-lifecycle | cut -f1)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add freenet-ui/web/index.html freenet-ui/recovery.go freenet-ui/auth_persistence_lifecycle_test.go
          git diff --cached --stat
          git commit -m 'fix(auth): persistent 30-day login and resilient session status'
          git push origin HEAD:refs/heads/fix/beta08-persistent-login-lifecycle
