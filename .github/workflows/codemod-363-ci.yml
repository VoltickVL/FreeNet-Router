name: codemod-363-ci
on:
  push:
    branches:
      - fix/363-safe-v038-ui-polish
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[codemod-363-ci-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/363-safe-v038-ui-polish
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted compatibility fix
        run: python tools/codemod_363_ci.py
      - name: Remove temporary codemod files
        run: rm -f tools/codemod_363_ci.py .github/workflows/codemod-363-ci.yml
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: preserve coordinator request-count contract (#363) [codemod-363-ci-done]'
          git push origin HEAD:fix/363-safe-v038-ui-polish
