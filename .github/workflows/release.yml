name: FreeNet Router Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: freenet-ui/go.mod

      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid VERSION: $VERSION" >&2; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp UI version from VERSION
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          UI_VERSION="${VERSION#v}"
          sed -i "s/^const version = \".*\"$/const version = \"$UI_VERSION\"/" freenet-ui/main.go
          grep -Fq "const version = \"$UI_VERSION\"" freenet-ui/main.go
          echo "FreeNet UI version: $UI_VERSION"

      - name: Tests
        working-directory: freenet-ui
        run: |
          go test ./...
          go vet ./...

      - name: Shell syntax
        run: |
          sh -n bootstrap.sh
          sh -n install.sh
          sh -n scripts/vpn
          sh -n scripts/blanc_xkeen_update_outbounds.sh
          sh -n scripts/migrate_split_dns.sh
          sh -n scripts/bootstrap_entware.sh
          sh -n scripts/apply_network_profile.sh
          sh -n scripts/apply_provider_profile.sh
          sh -n scripts/finalize_setup.sh
          sh -n scripts/self_update.sh
          sh -n tests/test_split_dns_migration.sh
          sh -n tests/test_bootstrap_contract.sh
          sh -n tests/test_product_bootstrap_contract.sh
          sh -n tests/test_network_profile_contract.sh
          sh -n tests/test_provider_profile_apply.sh
          sh -n tests/test_finalize_setup.sh
          sh -n tests/test_self_update.sh
          sh -n deploy/S99freenet-ui

      - name: Split DNS migration candidate test
        run: sh tests/test_split_dns_migration.sh

      - name: Entware bootstrap contract test
        run: sh tests/test_bootstrap_contract.sh

      - name: Product bootstrap contract test
        run: sh tests/test_product_bootstrap_contract.sh

      - name: ISP network profile contract test
        run: sh tests/test_network_profile_contract.sh

      - name: Provider profile transactional test
        run: sh tests/test_provider_profile_apply.sh

      - name: Browser setup completion contract test
        run: sh tests/test_finalize_setup.sh

      - name: Web self update transactional contract
        run: sh tests/test_self_update.sh

      - name: Installer contract
        run: |
          grep -q 'REPO="VoltickVL/FreeNet-Router"' install.sh
          grep -q 'bootstrap_ip' install.sh
          grep -q 'normalize_legacy_cron' install.sh
          grep -q 'migrate_split_dns.sh' install.sh
          grep -q 'abort_signal' install.sh
          ! grep -q 'setup.sh' install.sh
          grep -q 'cp bootstrap.sh dist/bootstrap.sh' .github/workflows/release.yml
          grep -q 'cp scripts/apply_network_profile.sh dist/apply_network_profile.sh' .github/workflows/release.yml
          grep -q 'cp scripts/apply_provider_profile.sh dist/apply_provider_profile.sh' .github/workflows/release.yml
          grep -q 'cp scripts/finalize_setup.sh dist/finalize_setup.sh' .github/workflows/release.yml
          grep -q 'cp scripts/bootstrap_entware.sh dist/bootstrap_entware.sh' .github/workflows/release.yml
          grep -q 'cp scripts/self_update.sh dist/self_update.sh' .github/workflows/release.yml
          grep -q 'cp config/upstream-pins.env dist/upstream-pins.env' .github/workflows/release.yml
          grep -q 'Stamp UI version from VERSION' .github/workflows/release.yml

      - name: Secret surface guard
        run: |
          ! grep -Rni --exclude='*_test.go' -E \
            'vless://[0-9A-Fa-f-]{36}@|withblancvpn\.online|87\.86\.183\.|46\.37\.141\.4|blanc_subscription\.url.*https?://|"publicKey"[[:space:]]*:[[:space:]]*"[^$]' \
            bootstrap.sh install.sh scripts tests config freenet-ui deploy README.md docs

      - name: Build direct router assets
        run: |
          mkdir -p dist
          (
            cd freenet-ui
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
              go build -trimpath -ldflags='-s -w' -o ../dist/freenet-ui-arm64-v8a .
          )
          (
            cd freenet-ui
            CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat \
              go build -trimpath -ldflags='-s -w' -o ../dist/freenet-ui-mips32le .
          )
          (
            cd freenet-ui
            CGO_ENABLED=0 GOOS=linux GOARCH=mips GOMIPS=softfloat \
              go build -trimpath -ldflags='-s -w' -o ../dist/freenet-ui-mips32 .
          )

          cp bootstrap.sh dist/bootstrap.sh
          cp scripts/vpn dist/vpn
          cp scripts/blanc_xkeen_update_outbounds.sh dist/blanc_xkeen_update_outbounds.sh
          cp scripts/migrate_split_dns.sh dist/migrate_split_dns.sh
          cp scripts/apply_network_profile.sh dist/apply_network_profile.sh
          cp scripts/apply_provider_profile.sh dist/apply_provider_profile.sh
          cp scripts/finalize_setup.sh dist/finalize_setup.sh
          cp scripts/bootstrap_entware.sh dist/bootstrap_entware.sh
          cp scripts/self_update.sh dist/self_update.sh
          cp config/upstream-pins.env dist/upstream-pins.env
          cp install.sh dist/freenet
          cp config/freenet.conf.example dist/freenet.conf.example

          chmod 755 \
            dist/bootstrap.sh \
            dist/freenet-ui-arm64-v8a \
            dist/freenet-ui-mips32le \
            dist/freenet-ui-mips32 \
            dist/vpn \
            dist/blanc_xkeen_update_outbounds.sh \
            dist/migrate_split_dns.sh \
            dist/apply_network_profile.sh \
            dist/apply_provider_profile.sh \
            dist/finalize_setup.sh \
            dist/bootstrap_entware.sh \
            dist/self_update.sh \
            dist/freenet

          (
            cd dist
            sha256sum \
              bootstrap.sh \
              freenet-ui-arm64-v8a \
              freenet-ui-mips32le \
              freenet-ui-mips32 \
              vpn \
              blanc_xkeen_update_outbounds.sh \
              migrate_split_dns.sh \
              apply_network_profile.sh \
              apply_provider_profile.sh \
              finalize_setup.sh \
              bootstrap_entware.sh \
              self_update.sh \
              upstream-pins.env \
              freenet \
              freenet.conf.example \
              > SHA256SUMS
          )

          file dist/freenet-ui-*
          cat dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; VERSION must be bumped." >&2
            exit 1
          fi
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "FreeNet Router $VERSION" \
            --generate-notes
