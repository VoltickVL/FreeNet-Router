name: Patch legacy DNS assignment baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_network_profile.sh')
          s = p.read_text()
          line = "    native_assignments_valid || { fail_not_applied 'нет проверенного native DNS filter assignments snapshot; сначала требуется repair текущего XKeen/Xray DNS'; return 1; }\n"
          if s.count(line) != 1:
              raise SystemExit(f'global assignments gate count={s.count(line)}')
          s = s.replace(line, '', 1)
          opkg = '''        opkg)
            [ "$NDM_INTERCEPT_INITIAL" = off ] || { fail_not_applied 'Split mode имеет native DNS intercept; сначала требуется repair текущего XKeen/Xray DNS'; return 1; }
'''
          opkg_new = '''        opkg)
            native_assignments_valid || { fail_not_applied 'нет проверенного native DNS filter assignments snapshot; сначала требуется repair текущего XKeen/Xray DNS'; return 1; }
            [ "$NDM_INTERCEPT_INITIAL" = off ] || { fail_not_applied 'Split mode имеет native DNS intercept; сначала требуется repair текущего XKeen/Xray DNS'; return 1; }
'''
          if s.count(opkg) != 1:
              raise SystemExit(f'opkg gate count={s.count(opkg)}')
          s = s.replace(opkg, opkg_new, 1)
          partial = '''            esac
            say '[FreeNet Network] PARTIAL_NATIVE_CONTROL_PLANE=confirmed-native-engine'
            ;;
'''
          partial_new = '''            esac
            if ! native_assignments_valid; then
                preserve_native_assignments || { fail_not_applied 'не удалось сохранить подтверждённый partial native DNS filter assignments baseline'; return 1; }
            fi
            say '[FreeNet Network] PARTIAL_NATIVE_CONTROL_PLANE=confirmed-native-engine'
            ;;
'''
          if s.count(partial) != 1:
              raise SystemExit(f'partial branch count={s.count(partial)}')
          p.write_text(s.replace(partial, partial_new, 1))
          PY
