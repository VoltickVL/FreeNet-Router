name: Patch legacy DNS assignment baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_network_profile.sh')
          s = p.read_text()
          gate = "    native_assignments_valid || { fail_not_applied 'нет проверенного native DNS filter assignments snapshot; сначала требуется repair текущего XKeen/Xray DNS'; return 1; }\n"
          if s.count(gate) != 1:
              raise SystemExit(f'global assignments gate count={s.count(gate)}')
          s = s.replace(gate, '', 1)
          case_marker = '''    case "$NDM_FILTER_ENGINE_INITIAL" in
        opkg)
'''
          case_new = '''    case "$NDM_FILTER_ENGINE_INITIAL" in
        opkg)
            native_assignments_valid || { fail_not_applied 'нет проверенного native DNS filter assignments snapshot; сначала требуется repair текущего XKeen/Xray DNS'; return 1; }
'''
          if s.count(case_marker) != 1:
              raise SystemExit(f'opkg case marker count={s.count(case_marker)}')
          s = s.replace(case_marker, case_new, 1)
          partial = "            say '[FreeNet Network] PARTIAL_NATIVE_CONTROL_PLANE=confirmed-native-engine'\n"
          partial_new = "            if ! native_assignments_valid; then\n                preserve_native_assignments || { fail_not_applied 'не удалось сохранить подтверждённый partial native DNS filter assignments baseline'; return 1; }\n            fi\n            say '[FreeNet Network] PARTIAL_NATIVE_CONTROL_PLANE=confirmed-native-engine'\n"
          if s.count(partial) != 1:
              raise SystemExit(f'partial marker count={s.count(partial)}')
          p.write_text(s.replace(partial, partial_new, 1))
          PY
