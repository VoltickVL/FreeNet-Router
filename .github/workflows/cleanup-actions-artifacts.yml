name: One-time Actions artifact cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-actions-artifacts.yml'

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete all Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          count=0
          bytes=0
          while IFS=$'\t' read -r id size name; do
            [ -n "$id" ] || continue
            gh api --method DELETE "repos/$REPO/actions/artifacts/$id"
            count=$((count + 1))
            bytes=$((bytes + size))
            echo "Deleted artifact $id ($name, $size bytes)"
          done < <(
            gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | [.id, .size_in_bytes, .name] | @tsv'
          )
          echo "Deleted $count artifacts; reclaimed current storage bytes: $bytes"
