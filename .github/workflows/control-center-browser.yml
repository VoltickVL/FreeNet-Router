name: FreeNet Control Center Production Browser CI

on:
  pull_request:
    paths:
      - 'freenet-ui/**'
      - 'tests/test_control_center_production.cjs'
      - '.github/workflows/control-center-browser.yml'

permissions:
  contents: read

jobs:
  production-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: freenet-ui/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/freenet-production-browser" --no-package-lock --ignore-scripts playwright@1.51.1
          node "$RUNNER_TEMP/freenet-production-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Production handlers and complete VPN lifecycle
        env:
          NODE_PATH: ${{ runner.temp }}/freenet-production-browser/node_modules
          FREENET_PREVIEW_LOGS: 'yes'
        run: node tests/test_control_center_production.cjs
      - name: Upload synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-center-production-browser
          path: test-artifacts/control-center/
          if-no-files-found: ignore
